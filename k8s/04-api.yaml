apiVersion: apps/v1
kind: Deployment
metadata:
  name: minipay-api
  namespace: minipay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minipay-api
  template:
    metadata:
      labels:
        app: minipay-api
    spec:
      containers:
        - name: api
          image: minipay-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: minipay-settings
          env:
            - name: MINIPAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minipay-credentials
                  key: api-key
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: minipay-credentials
                  key: db-password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minipay-api
  namespace: minipay
spec:
  type: ClusterIP
  selector:
    app: minipay-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
